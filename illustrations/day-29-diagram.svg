<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">Kubernetes 叢集控制、流量與儲存關係圖</title>
  <desc id="desc">以不同顏色和線型區分控制面狀態更新、網路流量、資源引用和持久化資料讀寫。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3478a8"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d17a28"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#42836b"/></marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#75808a"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", sans-serif; fill: #24313a; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #58656e; }
      .section { font-size: 20px; font-weight: 700; letter-spacing: .04em; }
      .box-title { font-size: 20px; font-weight: 700; }
      .box-sub { font-size: 15px; fill: #58656e; }
      .label { font-size: 14px; fill: #44515a; }
      .small { font-size: 13px; fill: #58656e; }
      .control { fill: #edf5fa; stroke: #6b9fbd; stroke-width: 2; }
      .object { fill: #f4f1e8; stroke: #a69a79; stroke-width: 2; }
      .node { fill: #f1f5eb; stroke: #8ba26b; stroke-width: 2; }
      .traffic-box { fill: #fff3e6; stroke: #d99a53; stroke-width: 2; }
      .storage-box { fill: #edf6f0; stroke: #6d9d7f; stroke-width: 2; }
      .frame { fill: #ffffff; stroke: #cbd4d9; stroke-width: 2; }
      .line-blue { fill: none; stroke: #3478a8; stroke-width: 3; marker-end: url(#arrow-blue); }
      .line-orange { fill: none; stroke: #d17a28; stroke-width: 4; marker-end: url(#arrow-orange); }
      .line-green { fill: none; stroke: #42836b; stroke-width: 3; marker-end: url(#arrow-green); }
      .line-dashed { fill: none; stroke: #75808a; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrow-gray); }
      .line-gray { fill: none; stroke: #75808a; stroke-width: 3; marker-end: url(#arrow-gray); }
    </style>
  </defs>

  <rect width="1600" height="1120" fill="#f7fafb"/>
  <text x="64" y="62" class="title">Kubernetes 雲之島：控制、流量與儲存</text>
  <text x="64" y="94" class="subtitle">箭頭分別表示狀態協作、網路流量、API 資源關係與持久化資料讀寫</text>

  <!-- Control plane -->
  <rect x="60" y="126" width="1480" height="354" rx="20" class="frame"/>
  <text x="88" y="164" class="section">控制面：透過 API 觀察與更新叢集物件</text>
  <rect x="92" y="205" width="190" height="82" rx="14" class="object"/>
  <text x="187" y="238" text-anchor="middle" class="box-title">使用者 / kubectl</text>
  <text x="187" y="263" text-anchor="middle" class="box-sub">提交期望狀態</text>

  <rect x="365" y="194" width="220" height="104" rx="14" class="control"/>
  <text x="475" y="235" text-anchor="middle" class="box-title">API Server</text>
  <text x="475" y="264" text-anchor="middle" class="box-sub">驗證、提供 Kubernetes API</text>
  <path d="M282 246H354" class="line-blue"/>

  <rect x="365" y="354" width="220" height="76" rx="14" class="object"/>
  <text x="475" y="385" text-anchor="middle" class="box-title">etcd</text>
  <text x="475" y="410" text-anchor="middle" class="box-sub">持久保存 API 資料</text>
  <path d="M585 258H610V390H595" class="line-blue"/>
  <path d="M585 410H625V280H595" class="line-blue"/>

  <rect x="690" y="194" width="250" height="104" rx="14" class="control"/>
  <text x="815" y="231" text-anchor="middle" class="box-title">控制器</text>
  <text x="815" y="258" text-anchor="middle" class="box-sub">Deployment / ReplicaSet controllers</text>
  <path d="M585 222H690" class="line-blue"/>
  <path d="M690 274H585" class="line-blue"/>

  <rect x="1030" y="194" width="220" height="104" rx="14" class="control"/>
  <text x="1140" y="231" text-anchor="middle" class="box-title">Scheduler</text>
  <text x="1140" y="258" text-anchor="middle" class="box-sub">選擇 Pod 的目標 Node</text>
  <path d="M585 210H620V178H1140V194" class="line-blue"/>
  <path d="M1030 280V335H585V280" class="line-blue"/>

  <rect x="1300" y="194" width="204" height="104" rx="14" class="object"/>
  <text x="1402" y="231" text-anchor="middle" class="box-title">Ingress 物件</text>
  <text x="1402" y="258" text-anchor="middle" class="box-sub">HTTP 路由規則</text>
  <path d="M585 298V324H1402V298" class="line-dashed"/>

  <text x="92" y="456" class="small">控制器與 Scheduler 都透過 API Server 觀察或更新物件；圖示簡化多個不同的控制迴圈。</text>

  <!-- Node execution -->
  <rect x="60" y="510" width="1480" height="190" rx="20" class="frame"/>
  <text x="88" y="548" class="section">工作節點：kubelet 依排程結果執行 Pod</text>
  <rect x="150" y="578" width="230" height="84" rx="14" class="node"/>
  <text x="265" y="612" text-anchor="middle" class="box-title">Node 上的 kubelet</text>
  <text x="265" y="638" text-anchor="middle" class="box-sub">觀察指派給本 Node 的 Pod</text>
  <rect x="560" y="578" width="230" height="84" rx="14" class="node"/>
  <text x="675" y="612" text-anchor="middle" class="box-title">Container Runtime</text>
  <text x="675" y="638" text-anchor="middle" class="box-sub">建立並維護容器</text>
  <rect x="970" y="578" width="300" height="84" rx="14" class="node"/>
  <text x="1120" y="612" text-anchor="middle" class="box-title">Pod / Containers</text>
  <text x="1120" y="638" text-anchor="middle" class="box-sub">排程完成後在 Node 上執行</text>
  <path d="M380 620H560" class="line-gray" marker-end="url(#arrow-gray)"/>
  <path d="M790 620H970" class="line-gray" marker-end="url(#arrow-gray)"/>
  <path d="M585 280H660V490H245V578" class="line-blue"/>
  <path d="M285 578V500H650V280H585" class="line-blue"/>

  <!-- Traffic -->
  <rect x="60" y="730" width="1480" height="176" rx="20" class="frame"/>
  <text x="88" y="768" class="section">網路流量：服務抽象、後端清單與資料平面</text>
  <rect x="110" y="801" width="200" height="70" rx="14" class="traffic-box"/>
  <text x="210" y="831" text-anchor="middle" class="box-title">外部用戶端</text>
  <text x="210" y="854" text-anchor="middle" class="box-sub">HTTP / HTTPS</text>
  <rect x="420" y="801" width="220" height="70" rx="14" class="traffic-box"/>
  <text x="530" y="831" text-anchor="middle" class="box-title">Ingress Controller</text>
  <text x="530" y="854" text-anchor="middle" class="box-sub">依規則選擇後端</text>
  <rect x="770" y="790" width="230" height="86" rx="14" class="object"/>
  <text x="885" y="824" text-anchor="middle" class="box-title">Service</text>
  <text x="885" y="850" text-anchor="middle" class="box-sub">穩定的服務抽象</text>
  <rect x="1120" y="790" width="250" height="86" rx="14" class="object"/>
  <text x="1245" y="824" text-anchor="middle" class="box-title">EndpointSlice</text>
  <text x="1245" y="850" text-anchor="middle" class="box-sub">後端端點 IP / 狀態</text>
  <path d="M310 836H408" class="line-orange"/>
  <path d="M640 836H758" class="line-orange"/>
  <path d="M1000 836H1108" class="line-dashed"/>
  <path d="M1245 876V890H1450V620H1270" class="line-orange"/>
  <text x="1390" y="777" text-anchor="middle" class="small">資料平面轉送至 Pod</text>
  <path d="M1504 246H1520V710H530V801" class="line-dashed"/>
  <text x="790" y="705" class="small">Ingress Controller 觀察 Ingress 物件</text>
  <text x="88" y="895" class="small">kube-proxy 或其他資料平面依 Service / EndpointSlice 轉送；Ingress Controller 可能直連端點，不一定經過 ClusterIP。</text>

  <!-- Storage -->
  <rect x="60" y="936" width="1480" height="184" rx="20" class="frame"/>
  <text x="88" y="974" class="section">儲存：API 物件關係與實際資料讀寫分開看</text>
  <rect x="160" y="998" width="260" height="60" rx="13" class="node"/>
  <text x="290" y="1035" text-anchor="middle" class="box-title">Pod 使用 volume</text>
  <rect x="650" y="998" width="230" height="60" rx="13" class="object"/>
  <text x="765" y="1035" text-anchor="middle" class="box-title">PVC（儲存需求）</text>
  <rect x="1050" y="998" width="210" height="60" rx="13" class="storage-box"/>
  <text x="1155" y="1035" text-anchor="middle" class="box-title">PV（儲存資源）</text>
  <rect x="1370" y="998" width="150" height="60" rx="13" class="storage-box"/>
  <text x="1445" y="1035" text-anchor="middle" class="box-title">後端儲存</text>
  <path d="M420 1028H650" class="line-dashed"/>
  <path d="M880 1028H1050" class="line-dashed"/>
  <text x="960" y="1018" text-anchor="middle" class="small">綁定</text>
  <path d="M1260 1028H1370" class="line-dashed"/>
  <text x="1310" y="1018" text-anchor="middle" class="small">對應</text>
  <path d="M420 1058C650 1110 1130 1110 1360 1058" class="line-green" marker-start="url(#arrow-green)"/>
  <text x="890" y="1081" text-anchor="middle" class="small">資料讀寫：Pod ↔ 掛載的 volume ↔ 底層儲存（CSI / 驅動依環境而異）</text>

  <!-- Legend -->
  <path d="M78 1150H132" class="line-blue"/><text x="145" y="1156" class="small">控制與狀態更新</text>
  <path d="M330 1150H384" class="line-orange"/><text x="397" y="1156" class="small">網路流量</text>
  <path d="M520 1150H574" class="line-dashed"/><text x="587" y="1156" class="small">API 物件引用 / 關聯</text>
  <path d="M830 1150H884" class="line-green"/><text x="897" y="1156" class="small">持久化資料讀寫</text>
</svg>
